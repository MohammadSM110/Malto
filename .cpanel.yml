---
deployment:
  tasks:
    # 1. Define target deployment path (default: public_html for main domain)
    # For a subdomain, change to: $HOME/public_html/subdomain/
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH

    # 2. Add common cPanel Node.js binary paths to PATH for non-interactive shells
    - export PATH=/opt/cpanel/ea-nodejs22/bin:/opt/cpanel/ea-nodejs20/bin:/opt/cpanel/ea-nodejs18/bin:/opt/cpanel/ea-nodejs16/bin:/usr/local/bin:/usr/bin:$PATH

    # 3. If dist is missing and npm is available, install dependencies and compile
    - if [ ! -d "dist" ] && which npm >/dev/null 2>&1; then npm install --production=false && npm run build; fi

    # 4. Copy production build files to web root
    - if [ -d "dist" ]; then /bin/cp -R dist/. $DEPLOYPATH/; fi

    # 5. Always ensure .htaccess is deployed to public_html for SPA routing
    - if [ -f "public/.htaccess" ]; then /bin/cp public/.htaccess $DEPLOYPATH/.htaccess; fi
