---
deployment:
  tasks:
    # 1. Define target deployment path (default: public_html for main domain)
    # For a subdomain or addon domain, check cPanel > Domains > Document Root
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH

    # 2. Copy production build files to web root
    - /bin/cp -R dist/. $DEPLOYPATH/

    # 3. Ensure Apache .htaccess is present for React SPA routing
    - /bin/cp public/.htaccess $DEPLOYPATH/.htaccess 2>/dev/null || true

    # 4. Ensure correct file and folder permissions for web server (755 folders, 644 files)
    - /bin/chmod 644 $DEPLOYPATH/index.html 2>/dev/null || true
    - /bin/chmod 644 $DEPLOYPATH/.htaccess 2>/dev/null || true
    - /bin/chmod -R 755 $DEPLOYPATH/assets 2>/dev/null || true
